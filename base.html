{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Каталог растений{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <header class="shapka">
        <div class="vnutri">
            <h1>
                <img class="ikonka-shapka" src="{% static 'icons/list1.svg' %}" alt="">
                Учебная оранжерея
            </h1>
            <nav class="menu">
                <a href="{% url 'glavnaya' %}">Главная</a>
                <a href="{% url 'katalog' %}">Каталог</a>
                <a href="{% url 'dobavit' %}">Добавить</a>
            </nav>
        </div>
    </header>
    <main class="kontent">
        {% block kontent %}{% endblock %}
    </main>
    <footer class="podval">
        Учебный проект: каталог комнатных растений
    </footer>
</body>
</html>
